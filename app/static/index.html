<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuadra</title>
  <link rel="icon" type="image/png" href="/assets/cuadra-favicon.png?v=20261111g" />
    <link rel="stylesheet" href="/css/exafan.css?v=20261120i" />
  <link rel="stylesheet" href="/css/visor-pdf.css?v=20261119c" />
  <script src="/js/menu-acciones.js?v=20261117c"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="/js/api.js?v=20261116g"></script>
  <script src="/js/sesion.js?v=20261116i"></script>
  <script src="/js/visor-pdf.js?v=20261119c"></script>
  <script src="/js/obras.js?v=20261123d"></script>
</head>

<body>
  <div class="shell" :class="{ 'menu-compacto': menuCompacto }" x-data="gestionObras()" x-init="init()" x-cloak>
    <aside class="sidebar">
      <a class="brand" href="/" @click.prevent="ir('obras')" :title="menuCompacto ? 'Cuadra' : null">
        <img class="brand-logo" src="/assets/cuadra-logo.png?v=20261111g" alt="Cuadra" width="196" height="58" />
        <img class="brand-icon" src="/assets/cuadra-mark.png?v=20261111g" alt="Cuadra" width="40" height="40" />
      </a>
      <nav class="nav">
        <button type="button" :class="navActivo('obras') && 'activo'" @click="ir('obras')" title="Obras">
          <span class="nav-marca" aria-hidden="true">O</span>
          <span class="nav-etiqueta">Obras</span>
        </button>
        <a class="nav-enlace" href="/usuarios.html" title="Usuarios">
          <span class="nav-marca" aria-hidden="true">U</span>
          <span class="nav-etiqueta">Usuarios</span>
        </a>
        <a class="nav-enlace" href="/registro.html" title="Registro"
          x-show="yo && (yo.rol === 'direccion' || yo.rol === 'superadministrador')">
          <span class="nav-marca" aria-hidden="true">R</span>
          <span class="nav-etiqueta">Registro</span>
        </a>
      </nav>
      <div class="sesion" x-show="yo">
        <div class="sesion-quien" :title="yo ? yo.nombre : ''">
          <span class="sesion-inicial" x-text="inicialSesion()" aria-hidden="true"></span>
          <span class="sesion-nombre" x-text="yo ? yo.nombre : ''"></span>
        </div>
        <button type="button" class="sesion-salir" @click="salir()" aria-label="Cerrar sesión">
          <span class="sesion-salir-texto">Cerrar sesión</span>
        </button>
      </div>
      <button type="button" class="menu-toggle" @click="toggleMenu()"
        :title="menuCompacto ? 'Expandir menú' : 'Compactar menú'" :aria-expanded="(!menuCompacto).toString()"
        :aria-label="menuCompacto ? 'Expandir menú' : 'Compactar menú'" x-text="menuCompacto ? '›' : '‹'"></button>
    </aside>

    <main class="main">
      <input class="oculto" type="file" x-ref="ficheroExcel" multiple
        :accept="origenAlta === 'pedido' ? 'application/pdf,.pdf' : '.xlsx,.xlsm,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'"
        @change="elegirExcel($event)" />
      <input class="oculto" type="file" x-ref="ficheroPresupuesto"
        accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.webp,.bmp,.md,.txt,application/pdf,image/*"
        @change="elegirContratoCliente($event)" />
      <input class="oculto" type="file" x-ref="ficheroContrato"
        accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.webp,.bmp,.md,.txt,application/pdf,image/*"
        @change="elegirContrato($event)" />
      <input class="oculto" type="file" x-ref="ficheroParte" multiple
        accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,application/pdf,image/jpeg,image/png,image/tiff"
        @change="elegirParte($event)" />
      <input class="oculto" type="file" x-ref="ficheroFactura"
        accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.webp,.bmp,.md,.txt,application/pdf,image/*"
        @change="elegirFactura($event)" />
      <p class="estado-msg" x-show="error" x-text="error" aria-live="polite"></p>
      <p class="sub" x-show="cargando && screen === 'obras'">Cargando obras…</p>

      <template x-if="!cargando && screen === 'obras'">
        <div class="stack">
          <div class="fila-titulo">
            <div>
              <h1 class="h1 h1-lista">Obras</h1>
              <p class="sub" x-text="resumenObras"></p>
            </div>
            <div class="obra-acciones">
              <button type="button" class="btn btn-secondary btn-md" x-show="marcadas.length" :disabled="borrando"
                @click="borrarSeleccion()" x-text="etiquetaBorrarSeleccion()"></button>
              <button type="button" class="btn btn-primary btn-md" @click="nuevaObra()">+ Nueva obra</button>
            </div>
          </div>
          <div class="card scroll">
            <div class="tabla-obras">
              <div class="cabecera cols-obras">
                <span class="marca-fila">
                  <input type="checkbox" aria-label="Seleccionar todas las obras" :checked="todasMarcadas()"
                    :disabled="proyectos.length === 0"
                    x-effect="$el.indeterminate = algunaMarcada() && !todasMarcadas()" @click.stop
                    @change="marcarTodas($event.target.checked)" />
                </span>
                <span>Obra</span><span>Presupuesto</span><span>Facturado</span><span>Fase</span><span>Estado</span>
              </div>
              <template x-if="proyectos.length === 0">
                <p class="sub" style="padding: 16px">Todavía no hay obras. Sube los presupuestos Excel para crear la
                  primera.</p>
              </template>
              <template x-for="obra in proyectos" :key="obra.id">
                <div class="fila-obra cols-obras" :class="estaMarcada(obra.id) && 'marcada'" @click="abrirObra(obra)">
                  <label class="marca-fila" @click.stop>
                    <input type="checkbox" :checked="estaMarcada(obra.id)"
                      @change="marcarObra(obra.id, $event.target.checked)"
                      :aria-label="'Seleccionar ' + obra.nombre" />
                  </label>
                  <div class="obra-nombre">
                    <div>
                      <button type="button" class="enlace-fila" @click.stop="abrirObra(obra)">
                        <strong x-text="obra.nombre"></strong>
                      </button><br />
                      <span class="meta" x-text="'#' + obra.id + ' · ' + obra.tipo"></span>
                    </div>
                  </div>
                  <span class="num" x-text="euro(obra.presupuestado)"></span>
                  <div>
                    <span class="num" x-text="euro(obra.facturado) + ' · ' + porcentajeObra(obra)"></span>
                    <div class="barra-mini"><span :style="'width:' + porcentajeObra(obra)"></span></div>
                  </div>
                  <span class="meta" x-text="obra.tipo"></span>
                  <div class="obra-acciones">
                    <span class="badge" :class="'badge-' + tonoEstado(obra.estado)"
                      x-text="etiquetaEstado(obra.estado)"></span>
                    <span class="menu-fila" @click.stop>
                      <button type="button" class="btn-menu" :id="'acc-obra-' + obra.id" aria-haspopup="menu"
                        aria-expanded="false" :commandfor="'menu-obra-' + obra.id" command="toggle-popover"
                        :aria-label="'Acciones de ' + obra.nombre">
                        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                          <circle cx="8" cy="3.2" r="1.35"></circle>
                          <circle cx="8" cy="8" r="1.35"></circle>
                          <circle cx="8" cy="12.8" r="1.35"></circle>
                        </svg>
                      </button>
                      <div class="menu-popover" popover="auto" :id="'menu-obra-' + obra.id">
                        <div focusgroup="menu nomemory" :aria-labelledby="'acc-obra-' + obra.id">
                          <button type="button" class="menu-peligro" @click="borrarObra(obra)">Borrar</button>
                        </div>
                      </div>
                    </span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template x-if="screen !== 'obras'">
        <div class="stack">
          <div class="fila-titulo">
            <div>
              <div class="crumbs">
                <a href="#" @click.prevent="ir('obras')">Obras</a>
                <span>/</span>
                <span x-text="miga"></span>
              </div>
              <h1 class="h1 h1-obra" x-text="tituloObra"></h1>
              <p class="sub" x-text="subtituloObra"></p>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" x-show="proyecto"
              @click="borrarObra(proyecto)">Borrar obra</button>
          </div>
          <section class="isp" x-show="proyecto"
            :class="proyecto && proyecto.inversion_sujeto_pasivo ? 'isp-on' : 'isp-off'"
            aria-live="polite">
            <div class="isp-estado">
              <span class="isp-pill"
                x-text="proyecto && proyecto.inversion_sujeto_pasivo ? 'Sin IVA' : 'Con IVA'"></span>
              <div>
                <p class="isp-titulo"
                  x-text="proyecto && proyecto.inversion_sujeto_pasivo ? 'Esta obra factura sin IVA' : 'Esta obra factura con IVA'"></p>
                <p class="isp-ayuda" x-show="proyecto && !proyecto.inversion_sujeto_pasivo">
                  Si el promotor se autorrepercute el IVA, sube su carta. La obra pasa a inversión del sujeto pasivo y los importes se ven sin IVA.
                </p>
                <p class="isp-ayuda" x-show="proyecto && proyecto.inversion_sujeto_pasivo">
                  Inversión del sujeto pasivo. El promotor se autorrepercute el IVA. Los importes del contrato se muestran sin IVA.
                </p>
              </div>
            </div>
            <div class="isp-acciones">
              <template x-if="proyecto && !proyecto.inversion_sujeto_pasivo">
                <button type="button" class="btn btn-secondary btn-sm"
                  @click="$refs.cartaIsp.click()">Subir carta y facturar sin IVA</button>
              </template>
              <template x-if="proyecto && proyecto.inversion_sujeto_pasivo">
                <span class="isp-acciones">
                  <a class="btn btn-secondary btn-sm"
                    :href="'/proyectos/' + proyecto.id + '/carta-isp'">Ver carta</a>
                  <button type="button" class="btn btn-secondary btn-sm"
                    @click="$refs.cartaIsp.click()">Cambiar carta</button>
                  <button type="button" class="btn btn-secondary btn-sm"
                    @click="quitarIsp()">Volver a facturar con IVA</button>
                </span>
              </template>
            </div>
            <input type="file" accept="application/pdf,.pdf" hidden x-ref="cartaIsp"
              @change="marcarIsp($event)">
          </section>
          <template x-if="vista && vista.pasos && vista.pasos.length">
            <div class="pasos">
              <template x-for="(paso, i) in vista.pasos" :key="paso.id">
                <button type="button" class="paso" :class="{ activo: screen === paso.id, hecho: paso.completo }"
                  @click="ir(paso.id)">
                  <span class="punto" x-text="paso.completo ? '✓' : (i + 1)"></span>
                  <span class="paso-texto">
                    <span x-text="paso.etiqueta"></span>
                    <small x-text="paso.detalle"></small>
                  </span>
                </button>
              </template>
            </div>
          </template>
          <template x-if="vista && vista.pedidos && vista.pedidos.length">
            <section class="card" aria-labelledby="pedidos-titulo" style="padding: 20px">
              <h2 id="pedidos-titulo" class="h2">Pedidos de compra</h2>
              <ul>
                <template x-for="pedido in vista.pedidos" :key="pedido.pedido_id">
                  <li>
                    <strong x-text="pedido.numero"></strong>
                    <span x-show="pedido.rotulo" x-text="' · ' + pedido.rotulo"></span>
                    <p class="meta" x-show="pedido.aviso" x-text="pedido.aviso"></p>
                    <p class="meta" x-show="pedido.estado_revision === 'pendiente'">
                      Vienen marcadas montaje, colocación e instalación. Marca también lo que deba repercutir en las facturas.
                    </p>
                    <ul>
                      <template x-for="linea in pedido.lineas" :key="linea.tarea_id">
                        <li>
                          <input type="checkbox" :id="'lin-' + linea.tarea_id" x-model="linea.marcada"
                            x-show="pedido.estado_revision === 'pendiente'">
                          <label :for="'lin-' + linea.tarea_id">
                            <span x-text="linea.codigo + ' · ' + linea.descripcion"></span>
                            <span class="num" x-text="euro(linea.importe)"></span>
                          </label>
                          <span class="meta" x-show="pedido.estado_revision !== 'pendiente'"
                            x-text="linea.estado_revision"></span>
                        </li>
                      </template>
                    </ul>
                    <button type="button" class="btn btn-primary btn-sm"
                      x-show="pedido.estado_revision === 'pendiente'"
                      @click="confirmarPedido(pedido)">Confirmar líneas</button>
                    <span class="meta" x-show="pedido.estado_revision !== 'pendiente'">Confirmada</span>
                  </li>
                </template>
              </ul>
            </section>
          </template>
        </div>
      </template>

      <template x-if="screen === 'presupuestos' && up === 'empty'">
        <div class="stack">
          <label class="stack" style="gap: 6px; max-width: 420px">
            <span style="font-weight: 600">Nombre de la obra</span>
            <input class="campo" type="text" x-model="nombreObra" placeholder="Nombre de la obra" />
          </label>
          <div role="group" aria-label="Tipo de documento" style="display: flex; gap: 8px">
            <button type="button" class="btn btn-md"
              :class="origenAlta === 'excel' ? 'btn-primary' : 'btn-secondary'"
              :aria-pressed="(origenAlta === 'excel').toString()"
              @click="origenAlta = 'excel'">Presupuesto Excel</button>
            <button type="button" class="btn btn-md"
              :class="origenAlta === 'pedido' ? 'btn-primary' : 'btn-secondary'"
              :aria-pressed="(origenAlta === 'pedido').toString()"
              @click="origenAlta = 'pedido'">Pedido de compra</button>
          </div>
          <div class="dropzone" role="button" tabindex="0" :class="sobreDrop && 'sobre'"
            @click="$refs.ficheroExcel.click()" @dragover.prevent="sobreDrop = true" @dragleave="sobreDrop = false"
            @drop.prevent="soltarExcel($event)"
            @keydown.enter.prevent="$refs.ficheroExcel.click()"
            @keydown.space.prevent="$refs.ficheroExcel.click()">
            <div class="drop-icon" aria-hidden="true">↑</div>
            <strong style="font-size: 18px; color: var(--p800)"
              x-text="origenAlta === 'pedido' ? 'Sube los pedidos de compra' : 'Sube los presupuestos Excel'"></strong>
            <span class="sub" style="max-width: 460px; line-height: 1.5"
              x-show="origenAlta !== 'pedido'">
              Uno o varios .xlsx o .xlsm de Expertis. Cada fichero es un apartado, con material y líneas de montaje.
              Queda pendiente de revisión.
            </span>
            <span class="sub" style="max-width: 460px; line-height: 1.5" x-show="origenAlta === 'pedido'">
              Sube los pedidos de compra. Cada PDF es una nave. Montaje, colocación e instalación vienen marcados; puedes marcar otras líneas antes de confirmar.
            </span>
            <span style="color: var(--p800); font-weight: 600">Arrastra los ficheros o haz clic para elegirlos</span>
          </div>
        </div>
      </template>

      <template x-if="(screen === 'presupuestos' || screen === 'presupuesto') && up === 'reading'">
        <div class="leyendo">
          <div class="preview-scan">
            <template x-for="(ancho, i) in lineasDoc" :key="i">
              <div class="fake-line" :style="'width:' + ancho"></div>
            </template>
            <div class="scan"></div>
          </div>
          <div class="stack" style="justify-content: center">
            <strong style="font-size: 18px; color: var(--p800)"
              x-text="origenAlta === 'pedido' && screen === 'presupuestos' ? 'Leyendo pedidos…' : (screen === 'presupuestos' ? 'Leyendo presupuestos…' : 'Leyendo contrato del cliente…')"></strong>
            <span class="sub" x-text="ficheroNombre"></span>
            <div class="stack" style="gap: 8px">
              <span x-show="screen === 'presupuestos'">Se lee la rejilla del Excel: partidas, totales y líneas de
                montaje.</span>
              <span x-show="screen === 'presupuesto'">Se contrasta el importe de cada apartado del PDF con el Excel. No
                se crean partidas nuevas.</span>
            </div>
          </div>
        </div>
      </template>

      <template x-if="lectura && screen === 'presupuestos' && up === 'confirmado'">
        <div class="card" style="padding: 28px">
          <h2 class="h2">Presupuesto confirmado</h2>
          <p class="sub" x-text="lectura.nombre + ' · ' + lectura.fichero"></p>
          <p>La lectura ya está revisada. El proyecto deja de estar pendiente de esta confirmación.</p>
          <button type="button" class="btn btn-primary btn-md" @click="abrirProyectoLeido()">Abrir el proyecto</button>
        </div>
      </template>

      <template x-if="screen === 'presupuestos' && up === 'done' && panelPresupuesto">
        <div class="revision">
          <aside class="panel-doc">
            <div class="panel-doc-cab">
              <strong>Revisión del presupuesto</strong>
              <span class="meta" x-text="panelPresupuesto.metaFichero"></span>
            </div>
            <div class="cifras">
              <div>
                <strong x-text="panelPresupuesto.revisados"></strong><br />
                <span class="meta">Apartados revisados</span>
              </div>
              <div>
                <strong x-text="panelPresupuesto.n_partidas"></strong><br />
                <span class="meta">Filas leídas</span>
              </div>
            </div>
            <div class="barra-mini"><span :style="'width:' + panelPresupuesto.revisados_pct"></span></div>
            <div class="aviso-ambar" x-text="panelPresupuesto.aviso"></div>
            <div style="display: flex; justify-content: space-between">
              <span class="sub">Total leído</span>
              <strong x-text="panelPresupuesto.total"></strong>
            </div>
            <template x-if="panelPresupuesto.documentos && panelPresupuesto.documentos.length">
              <div class="docs-obra">
                <span class="meta">Documentos guardados</span>
                <template x-for="doc in panelPresupuesto.documentos" :key="'doc-' + doc.id">
                  <span class="docs-obra-fila">
                    <button type="button" class="btn-texto" x-show="esPdf(doc.nombre)"
                      @click="abrirVisorPdf(doc.url, doc.nombre)">Ver</button>
                    <a class="btn-texto" :href="doc.url" :title="doc.nombre"
                      x-text="doc.formato + ' · ' + doc.nombre"></a>
                  </span>
                </template>
              </div>
            </template>
            <button type="button" class="btn btn-primary btn-md" :disabled="panelPresupuesto.falta_revisar"
              @click="confirmarPresupuesto()" x-text="panelPresupuesto.etiquetaBoton"></button>
            <span class="meta" style="text-align: center" x-text="panelPresupuesto.ayudaBoton"></span>
          </aside>
          <div class="lista-aps">
            <div class="fila-titulo">
              <h2 class="h2">Apartados detectados</h2>
              <div style="display: flex; gap: 8px">
                <button type="button" class="btn btn-secondary btn-sm" @click="$refs.ficheroExcel.click()">Añadir
                  Excel</button>
                <button type="button" class="btn btn-secondary btn-sm" @click="nuevaLinea()">Añadir línea</button>
              </div>
            </div>
            <p class="meta">Abre cada apartado y comprueba sus subapartados. Puedes corregir o borrar lo detectado.</p>
            <template x-if="lineaForm">
              <form class="linea-form" @submit.prevent="guardarLinea()">
                <label>Código
                  <input x-model="lineaForm.codigo" maxlength="50" required />
                </label>
                <label>Descripción
                  <input x-model="lineaForm.descripcion" required />
                </label>
                <label>Importe
                  <input x-model="lineaForm.importe" inputmode="decimal" required />
                </label>
                <div class="linea-botones">
                  <button type="submit" class="btn btn-primary btn-sm" :disabled="guardandoLinea"
                    x-text="lineaForm.id ? 'Guardar' : 'Añadir'"></button>
                  <button type="button" class="btn btn-secondary btn-sm" @click="lineaForm = null">Cancelar</button>
                </div>
              </form>
            </template>
            <template x-for="(ap, i) in panelPresupuesto.apartados" :key="(ap.id || ap.codigo) + '-' + i">
              <article class="ap" :class="{ abierto: open === i, revisado: ap.revisado }">
                <div class="ap-cab">
                  <span class="codigo" @click="open = open === i ? -1 : i" x-text="ap.codigo"></span>
                  <div class="ap-nombre" @click="open = open === i ? -1 : i">
                    <strong>
                      <span x-text="ap.nombre"></span>
                      <span class="badge badge-warning" x-show="ap.solo_gestion">Solo gestión</span>
                      <span class="apagado" x-text="open === i ? '▾' : '▸'"></span>
                    </strong>
                    <div class="meta" :class="ap.hay_dudas && 'ambar'" x-text="ap.resumen"></div>
                  </div>
                  <strong class="num" x-text="ap.importe"></strong>
                  <div class="ap-acciones">
                    <button type="button" class="pill-ok" x-show="ap.revisado" @click="revisar(i)">✓ Revisado</button>
                    <button type="button" class="btn btn-secondary btn-sm" x-show="!ap.revisado"
                      @click="revisar(i)">Revisar</button>
                    <span class="menu-fila" x-show="!ap.solo_gestion" @click.stop>
                      <button type="button" class="btn-menu" :id="'acc-ap-' + (ap.id || i)" aria-haspopup="menu"
                        aria-expanded="false" :commandfor="'menu-ap-' + (ap.id || i)" command="toggle-popover"
                        :aria-label="'Acciones de ' + ap.nombre">
                        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                          <circle cx="8" cy="3.2" r="1.35"></circle>
                          <circle cx="8" cy="8" r="1.35"></circle>
                          <circle cx="8" cy="12.8" r="1.35"></circle>
                        </svg>
                      </button>
                      <div class="menu-popover" popover="auto" :id="'menu-ap-' + (ap.id || i)">
                        <div focusgroup="menu nomemory" :aria-labelledby="'acc-ap-' + (ap.id || i)">
                          <button type="button" @click="editarLinea(ap)">Editar</button>
                          <button type="button" class="menu-peligro" @click="borrarLinea(ap)">Borrar</button>
                        </div>
                      </div>
                    </span>
                  </div>
                </div>
                <div class="partidas" x-show="open === i && (ap.partidas.length || (ap.grupos && ap.grupos.length))">
                  <template x-if="ap.partidas.length">
                    <div class="partidas-inner">
                      <div class="grid-part th">
                        <span>Código</span><span>Descripción</span><span>Ud</span>
                        <span class="der">Descuento</span><span class="der">Precio</span><span
                          class="der">Importe</span>
                      </div>

                          <circle cx="8" cy="3.2" r="1.35"></circle>
                          <circle cx="8" cy="8" r="1.35"></circle>
                          <circle cx="8" cy="12.8" r="1.35"></circle>
                        </svg>
                      </button>
                      <div class="menu-popover" popover="auto" :id="'menu-fac-' + f.id">
                        <div focusgroup="menu nomemory" :aria-labelledby="'acc-fac-' + f.id">
                          <button type="button" class="menu-peligro" @click="borrarFactura(f)">Borrar</button>
                        </div>
                      </div>
                    </span>
                  </div>
                </template>
              </div>
            </div>
            <aside class="detalle" x-show="seleccion">
              <template x-if="seleccion">
                <div>
                  <div class="detalle-cab">
                    <div>
                      <span class="meta" x-text="seleccion.numero + ' · ' + seleccion.fecha"></span>
                      <div style="font-size: 17px; font-weight: 700; color: var(--p800)" x-text="seleccion.proveedor">
                      </div>
                      <span class="meta" x-text="seleccion.apartado"></span>
                      <span class="acciones-fichero">
                        <button type="button" class="btn-texto"
                          x-show="seleccion.tiene_fichero && esPdf(seleccion.fichero)"
                          @click="abrirVisorPdf(seleccion.url_fichero, seleccion.fichero)">Ver factura</button>
                        <a class="btn-texto" x-show="seleccion.tiene_fichero" :href="seleccion.url_fichero">Descargar
                          factura</a>
                        <button type="button" class="btn-texto" x-show="seleccion.tiene_certificacion && !seleccion.tiene_sello"
                          @click="abrirVisorPdf(seleccion.url_certificacion, 'certificacion-montaje.pdf')">Ver certificación</button>
                        <button type="button" class="btn-texto" x-show="seleccion.tiene_sello"
                          @click="abrirVisorPdf(seleccion.url_sello, 'sello-factura.pdf')">Ver PDF con sello</button>
                        <a class="btn-texto" x-show="seleccion.tiene_sello" :href="seleccion.url_sello">Descargar PDF con
                          sello</a>
                      </span>
                      <span class="meta verde" x-show="seleccion.tiene_certificacion"
                        x-text="'Certificación de montaje · ' + seleccion.certificacion_por + ' · ' + seleccion.certificacion_fecha"></span>
                      <span class="meta" x-show="seleccion.certificacion_omitida && !seleccion.tiene_certificacion">Certificación de montaje no necesaria</span>
                      <span class="meta" x-show="seleccion.referencia_alc"
                        x-text="'ALC/' + seleccion.referencia_alc"></span>
                    </div>
                    <button type="button" class="cerrar" @click="sel = null">×</button>
                  </div>
                  <div style="padding: 0 20px" x-show="seleccion.candidatos && seleccion.candidatos.length">
                    <label class="meta">Contrato del proveedor
                      <select :value="seleccion.contrato_id ? String(seleccion.contrato_id) : ''"
                        @change="enlazarContratoFactura(seleccion, $event.target.value)">
                        <option value="" disabled>Elige el contrato</option>
                        <template x-for="c in seleccion.candidatos" :key="c.id">
                          <option :value="String(c.id)" x-text="c.etiqueta"></option>
                        </template>
                      </select>
                    </label>
                  </div>
                  <div class="aviso-ambar" style="margin: 16px 20px 0" x-show="seleccion.es_duplicado"
                    x-text="seleccion.aviso_duplicado"></div>
                  <div class="aviso-ambar" style="margin: 16px 20px 0" x-show="seleccion.aviso_isp"
                    x-text="seleccion.aviso_isp"></div>
                  <div class="stack" style="gap: 6px; padding: 16px 20px 0">
                    <span class="meta" x-show="seleccion.codigo_contrato"
                      x-text="'Código ' + seleccion.codigo_contrato"></span>
                    <div class="aviso-ambar" x-show="seleccion.aviso_codigo" x-text="seleccion.aviso_codigo"></div>
                    <form class="stack" style="gap: 6px" x-show="!seleccion.codigo_contrato"
                      @submit.prevent="guardarCodigoFactura(seleccion)">
                      <label class="meta">Código de contrato
                        <input class="campo" type="text" required maxlength="16" autocomplete="off" spellcheck="false"
                          placeholder="PYCON244070" x-model="seleccion.codigo_escrito">
                      </label>
                      <button type="submit" class="btn btn-secondary btn-sm">Guardar código</button>
                    </form>
                  </div>
                  <div style="padding: 16px 20px" class="stack">
                    <span class="meta" style="font-weight: 600">Partida a partida frente al presupuesto</span>
                    <template x-for="ln in seleccion.lineas" :key="ln.codigo">
                      <div class="linea-cmp" :class="ln.mala && 'mala'">
                        <div style="display: flex; justify-content: space-between; gap: 10px">
                          <strong><span style="color: var(--p800)" x-text="ln.codigo"></span> <span
                              x-text="ln.descripcion"></span></strong>
                          <strong class="num" x-text="ln.importe"></strong>
                        </div>
                        <div class="meta num" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px">
                          <span x-text="'Facturado: ' + ln.facturado"></span>
                          <span x-text="'Presupuesto: ' + ln.presupuesto"></span>
                          <span x-text="'Acumulado: ' + ln.acumulado"></span>
                        </div>
                        <span class="nota-err" x-show="ln.nota" x-text="ln.nota"></span>
                      </div>
                    </template>
                  </div>
                  <div class="detalle-pie">
                    <div style="display: flex; justify-content: space-between">
                      <span>Desviación de la factura</span>
                      <strong :class="seleccion.desviacion_negativa ? 'rojo' : 'verde'"
                        x-text="seleccion.desviacion"></strong>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap">
                      <p class="sub" x-show="seleccion.falta_otra_persona">El sello lo tiene que poner otra persona.</p>
                      <button type="button" class="btn btn-secondary btn-sm"
                        x-show="seleccion.tiene_certificacion && !seleccion.tiene_sello"
                        @click="abrirVisorPdf(seleccion.url_certificacion, 'certificacion-montaje.pdf')">Ver certificación</button>
                      <button type="button" class="btn btn-secondary btn-sm" x-show="seleccion.tiene_sello"
                        @click="abrirVisorPdf(seleccion.url_sello, 'sello-factura.pdf')">Ver PDF con sello</button>
                      <a class="btn btn-primary btn-sm" x-show="seleccion.tiene_sello" :href="seleccion.url_sello">Descargar PDF con sello</a>
                      <template x-for="accion in seleccion.acciones" :key="accion.etiqueta">
                        <button type="button" class="btn btn-sm"
                          :class="accion.variante === 'primary' ? 'btn-primary' : 'btn-secondary'"
                          @click="resolver(seleccion.id, accion.resolucion)" x-text="accion.etiqueta"></button>
                      </template>
                      <button type="button" class="btn btn-secondary btn-sm"
                        @click="borrarFactura(seleccion)">Borrar factura</button>
                    </div>
                  </div>
                </div>
              </template>
            </aside>
          </div>
        </div>
      </template>

      <template x-if="vista && screen === 'control'">
        <div class="stack">
          <p class="isp isp-on" x-show="proyecto && proyecto.inversion_sujeto_pasivo">
            <span class="isp-pill">Sin IVA</span>
            <span>Importes sin IVA.</span>
          </p>
          <div class="kpis">
            <template x-for="kpi in vista.control.kpis" :key="kpi.etiqueta">
              <div class="kpi">
                <span class="meta" x-text="kpi.etiqueta"></span>
                <strong :style="'color:' + kpi.color" x-text="kpi.valor"></strong>
                <small x-text="kpi.detalle"></small>
              </div>
            </template>
          </div>
          <div class="banda">
            <div class="card crece" style="padding: 6px 20px 14px; flex: 999 1 520px">
              <div style="padding: 14px 0 6px">
                <h2 class="h2" style="font-size: 17px">Contratos de subcontrata</h2>
                <div class="leyenda" style="margin-top: 6px">
                  <span><i class="muestra-pres"></i> Presupuestado</span>
                  <span><i class="muestra-fact"></i> Facturado</span>
                </div>
              </div>
              <template x-for="fila in vista.control.filas" :key="fila.id">
                <div class="fila-ctrl estatica">
                  <div>
                    <strong x-text="fila.nombre"></strong>
                    <div class="meta">Contrato <span class="num" x-text="fila.contratado"></span><span x-show="fila.sin_iva"> sin IVA</span></div>
                  </div>
                  <div class="track-bloque">
                    <div class="track">
                      <div class="facturado" :style="'width:' + fila.ancho_facturado"></div>
                      <div class="marca" :style="'left:' + fila.ancho_presupuesto"></div>
                    </div>
                    <div class="track-cifras">
                      <span><i class="muestra-pres"></i> <span class="num" x-text="fila.presupuestado"></span></span>
                      <span><i class="muestra-fact"></i> <span class="num" x-text="fila.facturado"></span></span>
                    </div>
                  </div>
                </div>
              </template>
              <p class="sub" x-show="vista.control.filas.length === 0">Todavía no hay contratos de subcontrata.</p>
            </div>
            <div class="stack" style="flex: 1 1 300px">
              <h2 class="h2" style="font-size: 17px">Descuadres abiertos</h2>
              <template x-for="al in vista.control.alertas" :key="al.id + al.tipo">
                <button type="button" class="alerta" @click="irAlerta(al)">
                  <div style="display: flex; justify-content: space-between; gap: 10px; align-items: center">
                    <span class="badge" :class="'badge-' + al.tono" x-text="al.tipo"></span>
                    <strong :class="al.tono === 'warning' ? 'ambar' : 'rojo'" x-text="al.importe"></strong>
                  </div>
                  <strong x-text="al.titulo"></strong>
                  <span class="sub" x-text="al.texto"></span>
                </button>
              </template>
              <span class="sub" x-show="vista.control.alertas.length === 0">Sin descuadres abiertos.</span>
            </div>
          </div>
        </div>
      </template>
    </main>
    <dialog class="modal" x-ref="dialogoSello" @click="if ($event.target === $el) $el.close()"
      @close="selloError = ''">
      <form class="ficha-usuario" @submit.prevent="confirmarConSello()">
        <div class="modal-cabecera">
          <h2 class="h1" style="font-size: 20px">Referencia del sello</h2>
          <button type="button" class="modal-cerrar" @click="$refs.dialogoSello.close()"
            aria-label="Cerrar">×</button>
        </div>
        <p class="sub">Se imprime en azul en el PDF de la factura.</p>
        <label>
          Referencia ALC
          <span class="alc-linea">
            <span class="alc-fijo" aria-hidden="true">ALC/</span>
            <input class="campo" x-ref="campoAlc" name="referencia_alc" required maxlength="48"
              autocomplete="off" spellcheck="false" x-model="selloAlc" placeholder="00000" />
          </span>
        </label>
        <p class="rojo" x-show="selloError" x-text="selloError"></p>
        <div class="obra-acciones" style="justify-content: flex-end">
          <button class="btn btn-secondary btn-md" type="button"
            @click="$refs.dialogoSello.close()">Cancelar</button>
          <button class="btn btn-primary btn-md" type="submit" :disabled="confirmandoSello">
            <span x-text="confirmandoSello ? 'Confirmando…' : 'Confirmar y generar PDF'"></span>
          </button>
        </div>
      </form>
    </dialog>
    <dialog class="visor-pdf" x-ref="visorPdf" closedby="any" aria-labelledby="visor-pdf-titulo"
      @close="visorPdf = null">
      <div class="visor-pdf-cabecera">
        <h2 id="visor-pdf-titulo" x-text="visorPdf ? visorPdf.nombre : 'Documento'"></h2>
        <div class="visor-pdf-acciones">
          <a class="visor-pdf-descarga" x-show="visorPdf" :href="visorPdf ? visorPdf.descarga : null">Descargar</a>
          <button type="button" class="visor-pdf-cerrar" autofocus @click="$refs.visorPdf.close()"
            aria-label="Cerrar">×</button>
        </div>
      </div>
      <template x-if="visorPdf">
        <iframe class="visor-pdf-marco" :src="visorPdf.url" :title="visorPdf.nombre"></iframe>
      </template>
    </dialog>
  </div>
</body>

</html>
